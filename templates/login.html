<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar · Blog personal</title><link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"></head><body><main class="main"><h1>Acceso del autor</h1><p>Las entradas se leen libremente. Solo el autor puede publicar.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form class="form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form__group"><label for="usuario">Usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" required></div><div class="form__group"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="form__submit">Iniciar sesión</button></form><a href="{{ url_for('home') }}">Volver al blog</a></main></body></html>
